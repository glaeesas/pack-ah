<!DOCTYPE html>
<html>
<head>
  <script src="https://glaxyias.github.io/JS/cdn-resilient.js"></script>
  <script>
    window.gameconfig = {
      name: "Ben 10 - Ultimate Alien - Cosmic Destruction (USA)",
      url: "https://cdn.jsdelivr.net/gh/bubbls/ugss@7759113f0ec45c4b7ca6b1c8701dc40d75d5dc3c/Ben%2010%20-%20Ultimate%20Alien%20-%20Cosmic%20Destruction%20(USA)%20(En%2CFr%2CDe%2CEs%2CIt)/Ben%2010%20-%20Ultimate%20Alien%20-%20Cosmic%20Destruction%20(USA)%20(En%2CFr%2CDe%2CEs%2CIt).nds",
      core: "nds",
      min: 1,
      max: 2
    };
  </script>
  <script>
    function getParts(file, start, end) {
      let parts = [];
      for (let i = start; i <= end; i++) parts.push(file + ".part" + i);
      return parts;
    }
    async function mergeFiles(fileParts) {
      let buffers = [];
      for (let i = 0; i < fileParts.length; i++) {
        const res = await fetch(fileParts[i]);
        if (!res.ok) throw new Error('Failed part ' + i);
        buffers.push(await res.arrayBuffer());
        document.getElementById('loading-progress').textContent = 'Loading: ' + (i+1) + '/' + fileParts.length;
      }
      const blob = new Blob(buffers);
      return URL.createObjectURL(blob);
    }
  </script>
  <style>
    body, html { margin:0; padding:0; width:100%; height:100%; background:#121212; color:white; display:flex; align-items:center; justify-content:center; font-family:Arial; }
    #loading-progress { font-size:18px; }
  </style>
</head>
<body>
  <div id="game-container">
    <div id="game"></div>
    <div id="loading-progress">Loading: 0/0</div>
  </div>
  <script>
    (async function() {
      var parts = getParts(window.gameconfig.url, window.gameconfig.min, window.gameconfig.max);
      try {
        var gameUrl = await mergeFiles(parts);
        document.getElementById('loading-progress').remove();
        EJS_player = '#game';
        EJS_core = window.gameconfig.core;
        EJS_gameName = window.gameconfig.name;
        EJS_color = '#0064ff';
        EJS_startOnLoaded = true;
        EJS_pathtodata = 'https://cdn.jsdelivr.net/gh/genizy/emu@master/';
        EJS_gameUrl = gameUrl;
        var script = document.createElement('script');
        script.src = 'https://cdn.jsdelivr.net/gh/genizy/emu@master/loader.js';
        document.body.appendChild(script);
      } catch(e) {
        document.getElementById('loading-progress').textContent = 'Error loading game.';
        console.error(e);
      }
    })();
  </script>
</body>
</html>
