<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bloons</title>
  <script src="https://cdn.jsdelivr.net/npm/@ruffle-rs/ruffle"></script>
  <style>
    html, body { margin:0; padding:0; width:100%; height:100%; background:#000; overflow:hidden; }
    ruffle-player { width:100%; height:100%; }
  </style>
</head>
<body>
  <script>
    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = { autoplay: "on", unmuteOverlay: "hidden" };
    const ruffle = window.RufflePlayer.newest();
    const player = ruffle.createPlayer();
    document.body.appendChild(player);
    player.load("https://cdn.jsdelivr.net/gh/Stinkalistic/UGS@main/SWFs/bloons.swf");
  </script>
</body>
</html>
